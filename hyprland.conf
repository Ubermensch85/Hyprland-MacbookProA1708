# ============================
# Hyprland 0.51 - MacBookPro14,1 (compat)
# Obiettivo: zero errori "option not exist" / "too many args"
# ============================

# Monitor: niente addreserved per compatibilitÃ  massima
monitor = eDP-1,2560x1600@60,0x0,1.6
# Esterno fisso (blocca DP-2)
monitor = DP-2,1920x1080@60,1600x0,1.0






# Autostart essenziali
exec-once = ~/.local/bin/lid-watcher.sh
exec-once = dbus-update-activation-environment --systemd HYPRLAND_NO_SLEEP=1
exec-once = systemctl --user mask sleep.target suspend.target
exec-once = $HOME/.config/hypr/autostart
exec-once = bash -lc 'while :; do checkupdates >/dev/null 2>&1; sleep 900; done'

# Env (VAAPI Intel, Firefox Wayland)
env = LIBVA_DRIVER_NAME,iHD
env = MOZ_ENABLE_WAYLAND,1

# Input
input {
  kb_layout = it
  follow_mouse = 1
  sensitivity = -0.5
  touchpad {
    natural_scroll = true
    disable_while_typing = true
    tap-to-click = true
  } 
} 

# General layout (gaps piÃ¹ ampi per simulare reserved)
general {
  gaps_in = 10
  gaps_out = 36
  border_size = 2
  col.active_border = 0xffa0d7f2
  col.inactive_border = 0xffffffff
  resize_on_border = true
} 

# Decoration: solo parametri sicuramente supportati
decoration {
  rounding = 6
  active_opacity = 1.0
  inactive_opacity = 1.0
  fullscreen_opacity = 1.0
  blur {
    enabled = false
  } 
} 

# Animations (off)
animations {
  enabled = true
} 

# Dwindle
dwindle {
  pseudotile = no
  split_width_multiplier = 1.5
} 

# Misc (VRR off su pannello interno)
misc {
  disable_hyprland_logo = yes
  vrr = 0
} 

# Window rules
# fly-foot default
# windowrulev2 = float,        title:^(fly-foot)$
# windowrulev2 = move center,  title:^(fly-foot)$
# windowrulev2 = size 858 534, title:^(fly-foot)$

# fly-foot-write (come avevi)
windowrule = float on, pin on, size 858 534, match:title ^(fly-foot-write)$

# fly-foot-tiled (azzurro) aggiunta speculare
# windowrulev2 = float,        title:^(fly-foot-tiled)$
# windowrulev2 = move center,  title:^(fly-foot-tiled)$
# windowrulev2 = size 858 534, title:^(fly-foot-tiled)$
windowrule = float on, size 858 534, center on, match:class ^(fly-foot-info)$
# windowrulev2 = float, initialClass:^(foot)$, initialTitle:^(fly-foot-info)$

# Float + size + destra, con margine dall'alto (evita bordo inferiore)
windowrule = float on, size (monitor_w*0.5) (monitor_h*0.7), move ((monitor_w*1)-window_w-(monitor_w*0.05)) ((monitor_h*0.08)), match:initial_class ^(foot)$, match:initial_title ^(fly-foot-info)$

# Polkit KDE (come avevi)
windowrule = float on, match:class ^(org.kde.polkit-kde-authentication-agent-1)$

# windowrule = float on, size 1000 650, move 300 175, match:class ^(kitty)$, match:workspace 2
windowrule = float on, size 700 450, move 864 80, match:class ^(kitty)$, match:workspace 2
# Keybinds
$mainMod = SUPER

# Terminal
# Terminale default (giallo del tuo foot.ini attuale)
bind = $mainMod, RETURN, exec, footclient --title=fly-foot
# Azzurro "tiled" (come prima con override)
bind = SUPERSHIFT, RETURN, exec, footclient --override=colors.background=A0D7F2 --title=fly-foot-tiled
# Nero (come prima con override)
bind = SUPERSHIFTCTRL, RETURN, exec, footclient --override=colors.background=000000 --title=fly-foot
bind = $mainMod,K,exec, kitty

# Finestre
bind = $mainMod, Q, exec, hyprctl dispatch killactive
bind = $mainMod, O, togglefloating
bind = $mainMod, F, fullscreen
bind = $mainMod SHIFT, F, fullscreen
bind = $mainMod, D, exec, rofi -show drun
bind = $mainMod, C, centerwindow

# App
bind = $mainMod, B, exec, brave-browser-nightly --password-store=basic
bind = $mainMod, N, exec, nemo
bind = $mainMod, A, exec, killall -SIGUSR1 waybar
bind = $mainMod SHIFT, E, exec, $HOME/scripts/rofi-power.sh
bind = $mainMod, S, exec, hyprdvd --screensaver

# Mouse move/resize
bindm = $mainMod, mouse:272, resizewindow
bindm = $mainMod SHIFT, mouse:272, movewindow

# Battery Info
bind = $mainMod, I, exec, ~/battery_tooltip.sh
# Gammastep
bind = $mainMod, W, exec, ~/scripts/gammastep.sh toggle



# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

# Move to workspace (silent)
bind = SUPERSHIFT, 1, movetoworkspacesilent, 1
bind = SUPERSHIFT, 2, movetoworkspacesilent, 2
bind = SUPERSHIFT, 3, movetoworkspacesilent, 3
bind = SUPERSHIFT, 4, movetoworkspacesilent, 4
bind = SUPERSHIFT, 5, movetoworkspacesilent, 5
bind = SUPERSHIFT, 6, movetoworkspacesilent, 6
bind = SUPERSHIFT, 7, movetoworkspacesilent, 7
bind = SUPERSHIFT, 8, movetoworkspacesilent, 8
bind = SUPERSHIFT, 9, movetoworkspacesilent, 9
bind = SUPERSHIFT, 0, movetoworkspacesilent, 10

# Scroll per workspace
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1

# Audio / Mic (con volume-wob.sh)
bind = , XF86AudioRaiseVolume, exec, ~/.local/bin/volume-wob.sh up
bind = , XF86AudioLowerVolume, exec, ~/.local/bin/volume-wob.sh down
bind = , XF86AudioMute, exec, ~/.local/bin/volume-wob.sh mute
bind = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle


bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bind = , XF86MonBrightnessUp, exec, brightnessctl set 5%+

# Retroilluminazione tastiera (senza wob, solo cambio luminosità)
bind = , XF86KbdBrightnessDown, exec, brightnessctl -d apple::kbd_backlight* set 25%-
bind = , XF86KbdBrightnessUp, exec, brightnessctl -d apple::kbd_backlight* set +25%

# DPMS schermo + tastiera - RIMOSSO (bind duplicato causa conflitti)
# I tasti kbd brightness sono già gestiti sopra

# Lid Switch
bindl = , switch:on:Lid Switch, exec, hyprctl keyword monitor "eDP-1, disable" && brightnessctl -d spi::kbd_backlight set 0%
bindl = , switch:off:Lid Switch, exec, sh -c 'sleep 0.6; hyprctl keyword monitor "eDP-1, 2560x1600@60, 0x0, 1.6"; brightnessctl -d spi::kbd_backlight set 100%'